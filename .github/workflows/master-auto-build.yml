name: Master Auto Build
permissions:
    contents: write
on:
  pull_request:
    types:
      - closed
    branches: [ "master" ]
  workflow_dispatch:
jobs:
  build-master:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        run: |
          VERSION=$(cat "resources/universal-mod/version/mod-version.txt" | tr -d ' \n')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Extract commit Hash
        run: |
          # the entry "string version_name" lives in the grouped texts file STRING.umtexts (um-multitool's format); makemod writes the commit hash on its "post-commit." line
          COMMITHASH=$(awk '{sub(/\r$/,"")} /^=== /{on=($0=="=== string version_name")} on' "resources/universal-mod/res-texts/texts-eng_res/STRING.umtexts" | grep -oE '[0-9a-f]{7,}' | head -n 1)
          [ -n "$COMMITHASH" ] || COMMITHASH=$(git rev-parse --short=9 HEAD)   # never an empty hash in the zip's name
          echo "COMMITHASH=$COMMITHASH" >> $GITHUB_ENV

      - name: Declare ZIPNAME and echo the other variables
        run: |
          ZIPNAME="Universal-Mod-$VERSION-$COMMITHASH.zip"
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

      - name: Create ZIP Archive
        run: |
          zip -r $ZIPNAME "Universal-Mod"
          ls -lah $ZIPNAME

      - name: Package the launcher (EIStarter-UM)
        run: |
          sudo apt-get install -y p7zip-full unzip
          (cd tools/EIStarter-UM && ./package.sh)

      - name: Upload release
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: |
            ${{ env.ZIPNAME }}
            tools/eistarter-obt-1.zip
            tools/EIStarter-UM/dist/EIStarter-UM-*.zip
            tools/um-multitool/um-multitool
            tools/um-multitool/um-multitool.exe
            tools/um-multitool/um-multitool-xp32.exe
            tools/um-multitool/um-multitool-x86_64.AppImage
            Universal-Mod/um.dll
            tools/um-bot/um-bot
            tools/um-bot/um-bot.exe
          token: ${{ secrets.GITHUB_TOKEN }}
          makeLatest: true
          name: Universal Mod ${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          prerelease: false
          generateReleaseNotes: true
          allowUpdates: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
